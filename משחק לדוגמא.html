<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>חקירת בטיחות – מסוף יצחק רבין</title><style>body{margin:0;background:#0d2031;color:white;font-family:Arial;text-align:center}main{max-width:600px;margin:40px auto;padding:24px;background:#19384d;border-radius:18px}button{background:#ffba47;border:0;border-radius:12px;padding:15px;margin:8px;font-size:18px;cursor:pointer}#game{display:none}.answer{display:block;width:95%;margin:10px auto;background:#eaf2f6;color:#132b3c}#feedback{min-height:45px}</style></head><body><main><h1>🔎 מבצע: נעילה במסוף</h1><p>מסוף יצחק רבין | חקירת אירוע בטיחות</p><section id="intro"><p>המסוף נסגר בעקבות אירוע בטיחות. פתרו את השאלות כדי להשלים את התחקיר ולפתוח אותו מחדש.</p><button id="start" type="button">התחלת החקירה</button></section><section id="game"><h2 id="progress"></h2><h3 id="question"></h3><div id="answers"></div><p id="feedback"></p><button id="next" type="button" style="display:none">לשלב הבא ←</button></section></main><script>const questions=[{q:"זיהית כבל חשמל פגום באזור העבודה. מה עושים?",a:["ממשיכים לעבוד בזהירות","מפסיקים שימוש, מרחיקים אחרים ומדווחים","מתקנים לבד"],correct:1,tip:"ציוד חשמלי פגום מוצא משימוש ומועבר לטיפול מוסמך."},{q:"לפני עבודה בגובה, מה חובה לוודא?",a:["שהעבודה תסתיים מהר","שיש ציוד מתאים, הדרכה ואמצעי הגנה מנפילה","שיש עובד נוסף בסביבה בלבד"],correct:1,tip:"עבודה בגובה מחייבת עמידה בדרישות ההדרכה וההגנה."},{q:"גילית עשן מסוללת ליתיום-יון. מה הפעולה הנכונה?",a:["נוגעים בסוללה כדי לבדוק חום","מתרחקים, מזהירים ומזעיקים גורמי חירום לפי הנוהל","שופכים עליה משקה"],correct:1,tip:"סוללה פגומה עלולה להיכנס לבריחה תרמית ולפלוט גזים מסוכנים."},{q:"מה עושים כשמזהים מפגע בטיחות במסוף?",a:["מתעלמים אם אין נפגעים","מדווחים ומונעים חשיפה לסיכון לפי היכולת והנוהל","מחכים לסוף המשמרת"],correct:1,tip:"דיווח מוקדם מסייע למנוע תאונות."}];let i=0;const el=id=>document.getElementById(id);function show(){if(i>=questions.length){el("progress").textContent="🎉 החקירה הושלמה";el("question").textContent="המסוף נפתח מחדש!";el("answers").innerHTML="";el("feedback").textContent="כל הכבוד! זיהיתם את עקרונות הבטיחות.";el("next").textContent="שחקו שוב";el("next").style.display="inline-block";return}let x=questions[i];el("progress").textContent="שלב "+(i+1)+" מתוך "+questions.length;el("question").textContent=x.q;el("feedback").textContent="";el("next").style.display="none";el("answers").innerHTML="";x.a.forEach((v,j)=>{let b=document.createElement("button");b.className="answer";b.textContent=v;b.onclick=()=>{if(j===x.correct){el("feedback").textContent="✅ נכון! "+x.tip;el("next").style.display="inline-block";[...el("answers").children].forEach(z=>z.disabled=true)}else el("feedback").textContent="❌ לא מדויק. נסו שוב."};el("answers").appendChild(b)})}el("start").onclick=()=>{el("intro").style.display="none";el("game").style.display="block";show()};el("next").onclick=()=>{i=i>=questions.length?0:i+1;show()};</script></body></html>
